{{- if .Values.operator.enabled }}
# cert-controller watches the webhook TLS Secret through a namespace-scoped
# cache, so Secret access is granted only in the release namespace.
# create/list/watch are needed for bootstrap and the informer; get/update/patch
# are limited to the webhook Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "whereabouts.fullname" . }}-operator
  {{- include "whereabouts.namespace" . | nindent 2 }}
  labels:
    {{- include "whereabouts.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, list, watch]
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [{{ include "whereabouts.fullname" . }}-webhook-cert]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "whereabouts.fullname" . }}-operator
  {{- include "whereabouts.namespace" . | nindent 2 }}
  labels:
    {{- include "whereabouts.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "whereabouts.fullname" . }}-operator
subjects:
- kind: ServiceAccount
  name: {{ include "whereabouts.fullname" . }}-operator
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
{{- end }}

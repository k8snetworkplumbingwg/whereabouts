name: Image build
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Scan Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3.12.0

      - name: Build container image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          file: Dockerfile

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Run Trivy vulnerability scanner
        run: trivy image --ignore-unfixed --scanners vuln --severity CRITICAL,HIGH --exit-code 1 ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}

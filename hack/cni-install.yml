---
kind: ConfigMap
apiVersion: v1
metadata:
  name: cni-install-sh
  namespace: kube-system
data:
  install_cni.sh: |
    cd /tmp
    # Install the correct CNI plugin binaries for the node architecture.
    ARCH="$(uname -m)"
    case "$ARCH" in
      x86_64|amd64) CNI_TGZ="cni-plugins-linux-amd64-v1.1.1.tgz" ;;
      aarch64|arm64) CNI_TGZ="cni-plugins-linux-arm64-v1.1.1.tgz" ;;
      *) CNI_TGZ="cni-plugins-linux-amd64-v1.1.1.tgz" ;;
    esac
    wget "https://github.com/containernetworking/plugins/releases/download/v1.1.1/${CNI_TGZ}"
    cd /host/opt/cni/bin
    tar xvfzp "/tmp/${CNI_TGZ}"
    sleep infinite
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: install-cni-plugins
  namespace: kube-system
  labels:
    name: cni-plugins
spec:
  selector:
    matchLabels:
      name: cni-plugins
  template:
    metadata:
      labels:
        name: cni-plugins
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists
        effect: NoSchedule
      containers:
      - name: install-cni-plugins
        image: alpine
        command: ["/bin/sh", "/scripts/install_cni.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "50Mi"
          limits:
            cpu: "100m"
            memory: "50Mi"
        securityContext:
          privileged: true
        volumeMounts:
        - name: cni-bin
          mountPath: /host/opt/cni/bin
        - name: scripts
          mountPath: /scripts
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
        - name: scripts
          configMap:
            name: cni-install-sh
            items:
            - key: install_cni.sh
              path: install_cni.sh

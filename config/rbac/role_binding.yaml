metadata:
  name: whereabouts-operator
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: whereabouts-operator
subjects:
- kind: ServiceAccount
  name: operator
  namespace: system
